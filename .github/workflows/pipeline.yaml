name: Pipeline Project

on:
  pull_request:
    types:
      - closed

# github.event.pull_request.merged == true

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.merged == true }}
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Set up Docker
      uses: docker/setup-docker-action@v5
    
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN}}
    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        push: true
        tags: ghcr.io/${{ github.repository }}:latest
        context: .
        file: Dockerfile

  unit-test:
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.merged == true }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Set up Java
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '25'
        cache: 'maven'
    
    - name: Run with test
      run: mvn test
  
  sonar-analysis:
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.merged == true }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: SonarQube Scan
      uses: SonarSource/sonarqube-scan-action@v8
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  snik-analyze:
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.merged == true }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Snyk Code Scan
      continue-on-error: true  # continua aun si falla
      uses: snyk/actions/maven@v1.0.0
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    
  publish-artifact:
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.merged == true }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Set up Java
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '25'
        cache: 'maven'
    - name: Generate artifact
      run: mvn -q -B dependency:go-offline 

    - name: Build and Package
      run: mvn -q -B -DskipTests package
    
    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: popshop-artifact
        path: target/popshop-0.1.0.jar 
  
  consolidation-job:
    needs: [build, unit-test, sonar-analysis, snik-analyze, publish-artifact]
    runs-on: ubuntu-latest
    steps:
    - name: Reporte final
      run: echo "El pipeline se ejecuto correctamente"